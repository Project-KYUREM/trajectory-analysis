name: orbital_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pygmo
  - pykep
  - scipy
  - ipopt
  - cyipopt          # exposes IPOPT to pyOptSparse (aerocapture/)
  - nlopt
  - spiceypy
  - matplotlib
  - pytest           # aerocapture/tests
  - pyoptsparse
  - pip
  - pip:
      - openmdao
      - dymos
      - -e .           # the aerocapture package (pyproject.toml)
