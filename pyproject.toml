[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aerocapture"
version = "0.1.0"
description = "Neptune aerocapture and Triton ballute capture trajectory optimisation (Dymos)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["aerocapture*"]

[tool.pytest.ini_options]
testpaths = ["aerocapture/tests"]
pythonpath = ["."]
