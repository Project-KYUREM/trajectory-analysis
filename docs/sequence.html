<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kyurem — trajectory</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><a href="index.html" style="color:inherit">Kyurem</a></h1>
  <span class="sub" id="crumb"></span>
  <span class="spacer" style="flex:1"></span>
  <label class="sub">model <select id="modelSel"></select></label>
</header>
<main>
  <div class="run-wrap">
    <div class="panel">
      <div class="controls">
        <button id="axTrade" class="on">Cost vs time of flight</button>
        <button id="axPork">Launch / arrival porkchop</button>
        <span class="spacer"></span>
        <button id="frontOnly">Front only</button>
      </div>
      <div id="scatter"></div>
      <p class="muted" id="scatterHint">Click a point to inspect. Ringed points are Pareto-optimal (largest rings were locally polished); only detailed points are clickable.</p>
    </div>
    <div class="panel detail">
      <div id="detailHead"><p class="placeholder">Select a trajectory on the left.</p></div>
      <!-- Kept outside the region that is rewritten per selection, so Plotly diffs
           the 3D scene in place instead of creating a new WebGL context each click. -->
      <div id="view3d" hidden></div>
      <div id="detailBody"></div>
    </div>
  </div>
</main>
<script src="vendor/plotly.min.js"></script>
<script src="common.js"></script>
<script src="kepler.js"></script>
<script src="run.js"></script>
</body>
</html>
